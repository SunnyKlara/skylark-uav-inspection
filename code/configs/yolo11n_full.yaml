# YOLOv11n + CBAM + P2 小目标头
# 这是你的"最终方法":三件套全开
nc: 80

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]    # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]   # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, CBAM, [512]]         # 5  P3 + CBAM
  - [-1, 1, Conv, [512, 3, 2]]   # 6  P4/16
  - [-1, 2, C3k2, [512, True]]   # 7
  - [-1, 1, CBAM, [512]]         # 8  P4 + CBAM
  - [-1, 1, Conv, [1024, 3, 2]]  # 9  P5/32
  - [-1, 2, C3k2, [1024, True]]  # 10
  - [-1, 1, SPPF, [1024, 5]]     # 11
  - [-1, 2, C2PSA, [1024]]       # 12
  - [-1, 1, CBAM, [1024]]        # 13 P5 + CBAM

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 8], 1, Concat, [1]]                   # 15
  - [-1, 2, C3k2, [512, False]]                 # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 5], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [256, False]]                 # 19  P3 out

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 20
  - [[-1, 2], 1, Concat, [1]]                   # 21
  - [-1, 2, C3k2, [128, False]]                 # 22  P2 out (small-object head)

  - [-1, 1, Conv, [128, 3, 2]]                  # 23
  - [[-1, 19], 1, Concat, [1]]                  # 24
  - [-1, 2, C3k2, [256, False]]                 # 25  P3 refined

  - [-1, 1, Conv, [256, 3, 2]]                  # 26
  - [[-1, 16], 1, Concat, [1]]                  # 27
  - [-1, 2, C3k2, [512, False]]                 # 28  P4 refined

  - [-1, 1, Conv, [512, 3, 2]]                  # 29
  - [[-1, 13], 1, Concat, [1]]                  # 30
  - [-1, 2, C3k2, [1024, True]]                 # 31  P5 refined

  # 四尺度检测头(P2 + P3 + P4 + P5)
  - [[22, 25, 28, 31], 1, Detect, [nc]]
