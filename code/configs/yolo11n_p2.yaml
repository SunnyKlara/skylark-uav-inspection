# YOLOv11n + P2 小目标检测头
# 增加一层 stride=4 的检测分支,有利于小目标(光伏隐裂等)
nc: 80

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]    # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1  P2/4   <-- 用作 P2 检测头来源
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2]]   # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4
  - [-1, 1, Conv, [512, 3, 2]]   # 5  P4/16
  - [-1, 2, C3k2, [512, True]]   # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7  P5/32
  - [-1, 2, C3k2, [1024, True]]  # 8
  - [-1, 1, SPPF, [1024, 5]]     # 9
  - [-1, 2, C2PSA, [1024]]       # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                   # 12 -> P4
  - [-1, 2, C3k2, [512, False]]                 # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                   # 15 -> P3
  - [-1, 2, C3k2, [256, False]]                 # 16  P3 out

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 2], 1, Concat, [1]]                   # 18 -> P2
  - [-1, 2, C3k2, [128, False]]                 # 19  P2 out (NEW small-object head)

  - [-1, 1, Conv, [128, 3, 2]]                  # 20
  - [[-1, 16], 1, Concat, [1]]                  # 21
  - [-1, 2, C3k2, [256, False]]                 # 22  P3 refined

  - [-1, 1, Conv, [256, 3, 2]]                  # 23
  - [[-1, 13], 1, Concat, [1]]                  # 24
  - [-1, 2, C3k2, [512, False]]                 # 25  P4 refined

  - [-1, 1, Conv, [512, 3, 2]]                  # 26
  - [[-1, 10], 1, Concat, [1]]                  # 27
  - [-1, 2, C3k2, [1024, True]]                 # 28  P5 refined

  # P2(19) + P3(22) + P4(25) + P5(28) 四尺度检测头
  - [[19, 22, 25, 28], 1, Detect, [nc]]
